<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal TI - Agrícola Avanti</title>
  <link rel="icon" type="image/jpeg" href="/AVANTI%20LOGO%20(1).jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .bg-main-dark { background-color: #0b111e; }
    .input-clean {
      background-color: #141d30;
      border: 1px solid #23324d;
      color: #f8fafc;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-clean:focus {
      border-color: #10B981;
      outline: none;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }
    .pattern-dots {
      background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Autocomplete fix for Chrome */
    .input-clean:-webkit-autofill,
    .input-clean:-webkit-autofill:hover, 
    .input-clean:-webkit-autofill:focus, 
    .input-clean:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #141d30 inset !important;
        -webkit-text-fill-color: #ffffff !important;
        transition: background-color 5000s ease-in-out 0s;
    }

    /* Toast styles */
    .toast-notification {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #ef4444;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 1000;
    }
    .toast-notification.success {
        background-color: #10B981;
    }
    .toast-notification.show {
        transform: translateY(0);
        opacity: 1;
    }
    .toast-notification.hidden {
        display: none;
    }
  </style>
  <script>
    // Si ya hay sesión, redirigir al dashboard inmediatamente
    if (localStorage.getItem('session')) {
        window.location.replace('dashboard.html');
    }
  </script>
</head>
<body class="min-h-screen flex flex-col lg:flex-row bg-main-dark text-slate-100">

  <!-- ==========================================
       PANEL IZQUIERDO: IDENTIDAD CORPORATIVA
       ========================================== -->
  <div class="lg:w-1/2 bg-white text-slate-900 flex flex-col justify-between p-10 sm:p-16 lg:p-20 border-r border-slate-200 pattern-dots">
    <div>
      <img src="AVANTI LOGO (1).jpeg" alt="Avanti" class="h-20 w-auto object-contain mb-10">
      
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 leading-tight">
        Sistema de Control de Activos y Actas TI
      </h1>
      <p class="text-base font-semibold text-emerald-600 mt-2">
        Agrícola Avanti S.A.C.
      </p>
    </div>

    <!-- VERSIÓN INTEGRADA AL PIE (SIN ELEMENTOS FLOTANTES) -->
    <div class="text-xs text-slate-400 font-mono flex items-center justify-between border-t border-slate-200 pt-6">
      <span>© 2026 Agrícola Avanti S.A.C.</span>
      <span class="text-slate-500 font-semibold">v2.0</span>
    </div>
  </div>

  <!-- ==========================================
       PANEL DERECHO: LOGIN Y REGISTRO
       ========================================== -->
  <div class="lg:w-1/2 flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-sm min-h-[380px] flex flex-col justify-center">
      
      <!-- TÍTULO DINÁMICO -->
      <h2 id="formTitle" class="text-2xl font-bold text-white mb-6 tracking-wide">
        Iniciar Sesión
      </h2>

      <!-- FORMULARIO 1: LOGIN -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="loginEmail" class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">
            Correo
          </label>
          <input type="email" id="loginEmail" required autofocus class="w-full px-3.5 py-2.5 rounded-lg text-sm input-clean font-medium">
        </div>

        <div>
          <label for="loginPassword" class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">
            Contraseña
          </label>
          <div class="relative">
            <input type="password" id="loginPassword" required class="w-full pl-3.5 pr-10 py-2.5 rounded-lg text-sm input-clean font-medium">
            <button type="button" onclick="togglePass('loginPassword', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 cursor-pointer">
              <!-- SVG Ojo Limpio -->
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center pt-1">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 bg-slate-800 border-slate-700 cursor-pointer">
          <label for="rememberMe" class="ml-2 text-xs text-slate-300 select-none cursor-pointer">Recordar sesión</label>
        </div>

        <button type="submit" id="btnSubmit" class="w-full mt-2 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition shadow-sm cursor-pointer flex justify-center items-center gap-2">
          <span>Ingresar al Portal</span>
        </button>

        <p class="text-center text-xs text-slate-400 pt-3">
          ¿No tienes cuenta? <a href="#" id="btnIrRegistro" class="text-emerald-400 hover:text-emerald-300 font-semibold underline">Regístrate</a>
        </p>
      </form>

      <!-- FORMULARIO 2: REGISTRO (OCULTO) -->
      <form id="registerForm" class="space-y-4 hidden">
        <div>
          <label for="regName" class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">
            Nombre Completo
          </label>
          <input type="text" id="regName" required class="w-full px-3.5 py-2.5 rounded-lg text-sm input-clean font-medium">
        </div>

        <div>
          <label for="regEmail" class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">
            Correo
          </label>
          <input type="email" id="regEmail" required class="w-full px-3.5 py-2.5 rounded-lg text-sm input-clean font-medium">
        </div>

        <div>
          <label for="regPassword" class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">
            Contraseña
          </label>
          <div class="relative">
            <input type="password" id="regPassword" required class="w-full pl-3.5 pr-10 py-2.5 rounded-lg text-sm input-clean font-medium">
            <button type="button" onclick="togglePass('regPassword', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 cursor-pointer">
              <!-- SVG Ojo Limpio -->
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btnSubmitReg" class="w-full mt-2 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition shadow-sm cursor-pointer flex justify-center items-center gap-2">
          <span>Crear Cuenta</span>
        </button>

        <p class="text-center text-xs text-slate-400 pt-3">
          ¿Ya tienes cuenta? <a href="#" id="btnIrLogin" class="text-emerald-400 hover:text-emerald-300 font-semibold underline">Inicia sesión</a>
        </p>
      </form>

    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="toast-notification hidden">
    <span class="toast-icon">⚠️</span>
    <span id="toastMessage">Error message</span>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formTitle = document.getElementById('formTitle');
    const btnIrRegistro = document.getElementById('btnIrRegistro');
    const btnIrLogin = document.getElementById('btnIrLogin');

    btnIrRegistro.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
      formTitle.textContent = 'Crear Cuenta';
      document.getElementById('regName').focus();
    });

    btnIrLogin.addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
      formTitle.textContent = 'Iniciar Sesión';
      document.getElementById('loginEmail').focus();
    });

    function togglePass(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      
      // Alternar icono SVG (ojo abierto / ojo tachado)
      btn.innerHTML = isPassword 
        ? `<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path></svg>`
        : `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`;
    }

    function showToast(message, isSuccess = false) {
        const toast = document.getElementById('toastNotification');
        const toastMsg = document.getElementById('toastMessage');
        toastMsg.textContent = message;
        
        if (isSuccess) {
            toast.classList.add('success');
            toast.querySelector('.toast-icon').textContent = '✓';
        } else {
            toast.classList.remove('success');
            toast.querySelector('.toast-icon').textContent = '⚠️';
        }
        
        toast.classList.remove('hidden');
        // Reflow
        void toast.offsetWidth;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.classList.add('hidden'), 300);
        }, 4000);
    }

    // Auto-fill saved email if available
    window.addEventListener('DOMContentLoaded', () => {
        const savedEmail = localStorage.getItem('savedEmail');
        if (savedEmail) {
            document.getElementById('loginEmail').value = savedEmail;
            document.getElementById('rememberMe').checked = true;
        }
    });

    // ==========================================
    // LÓGICA DE LOGIN (Conectada a Neon DB)
    // ==========================================
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const submitBtn = document.getElementById('btnSubmit');

        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Verificando...</span>';
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

        try {
            const response = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo: email, password: password })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                const userRole = data.user.rol === 'Administrador' ? 'admin' : 'viewer';
                const session = { 
                    id: data.user.id_usuario,
                    name: data.user.nombre, 
                    role: userRole, 
                    token: 'auth-' + Date.now() 
                };
                
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('savedEmail', email);
                } else {
                    localStorage.removeItem('savedEmail');
                }
                localStorage.setItem('session', JSON.stringify(session));
                window.location.replace('dashboard.html');
            } else {
                showToast(data.message || 'Correo o contraseña incorrectos.');
            }
        } catch (error) {
            showToast('Hubo un problema al conectar con el servidor.');
            console.error('Error de fetch:', error);
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    });

    // ==========================================
    // LÓGICA DE REGISTRO
    // ==========================================
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const submitBtn = document.getElementById('btnSubmitReg');

        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Creando...</span>';
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

        try {
            const response = await fetch('/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: name, correo: email, password: password })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showToast('¡Cuenta creada con éxito! Ya puedes iniciar sesión.', true);
                registerForm.reset();
                btnIrLogin.click();
            } else {
                showToast(data.message || 'Ocurrió un error al crear la cuenta.');
            }
        } catch (error) {
            showToast('Hubo un problema al conectar con el servidor.');
            console.error('Error de fetch:', error);
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    });
  </script>
</body>
</html>
