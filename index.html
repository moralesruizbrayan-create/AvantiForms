<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Portal - Agrícola Avanti S.A.C.</title>
  <link rel="icon" type="image/jpeg" href="/AVANTI%20LOGO%20(1).jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .bg-dark-brand { background-color: #0c1322; }
    .input-dark {
      background-color: #162035;
      border: 1px solid #233352;
      color: #ffffff;
      transition: all 0.2s;
    }
    .input-dark:focus {
      border-color: #10B981;
      outline: none;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }
    .pattern-dots {
      background-image: radial-gradient(#E2E8F0 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    /* Autocomplete fix for Chrome */
    .input-dark:-webkit-autofill,
    .input-dark:-webkit-autofill:hover, 
    .input-dark:-webkit-autofill:focus, 
    .input-dark:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #162035 inset !important;
        -webkit-text-fill-color: #ffffff !important;
        transition: background-color 5000s ease-in-out 0s;
    }

    /* Toast styles */
    .toast-notification {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #ef4444;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 1000;
    }
    .toast-notification.show {
        transform: translateY(0);
        opacity: 1;
    }
    .toast-notification.hidden {
        display: none;
    }
  </style>
  <script>
    // Si ya hay sesión, redirigir al dashboard inmediatamente
    if (localStorage.getItem('session')) {
        window.location.replace('dashboard.html');
    }
  </script>
</head>
<body class="min-h-screen flex flex-col lg:flex-row bg-dark-brand text-slate-100">

  <!-- PANEL IZQUIERDO: MARCA E IDENTIDAD (TAL CUAL LA PRIMERA FOTO) -->
  <div class="lg:w-1/2 bg-white text-slate-900 flex flex-col justify-between p-8 sm:p-14 lg:p-20 relative border-r border-slate-200 pattern-dots">
    
    <div>
      <!-- LOGO -->
      <div class="mb-8">
        <img src="AVANTI LOGO (1).jpeg" alt="Agrícola Avanti" class="h-20 w-auto object-contain">
      </div>

      <!-- TÍTULO PRINCIPAL -->
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 leading-tight">
        Sistema de Control de Activos y Actas TI
      </h1>
      <p class="text-lg font-semibold text-emerald-600 mt-2">
        Agrícola Avanti S.A.C.
      </p>

      <!-- INSIGNIA DE VERSIÓN -->
      <div class="mt-8 flex items-center gap-3">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold">
          <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
          Versión 2.0
        </div>
      </div>
    </div>

    <!-- FOOTER IZQUIERDO -->
    <div class="mt-12 pt-6 border-t border-slate-200 text-xs text-slate-500">
      © 2026 Agrícola Avanti S.A.C. Todos los derechos reservados.
    </div>
  </div>

  <!-- PANEL DERECHO: LOGIN LIMPIO (SIN AUDITORÍA NI ENLACES INNECESARIOS) -->
  <div class="lg:w-1/2 flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-md">
      
      <!-- ENCABEZADO LOGIN -->
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-white tracking-wide">Iniciar Sesión</h2>
        <p class="text-xs text-slate-400 mt-1.5">Ingresa tus credenciales corporativas</p>
      </div>

      <!-- FORMULARIO DE ACCESO -->
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">
            Correo Corporativo
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">@</span>
            <input type="email" id="loginEmail" required placeholder="soporte@agricolaavanti.pe" 
                   class="w-full pl-10 pr-4 py-3 rounded-lg text-sm input-dark">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">
            Contraseña
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">🔒</span>
            <input type="password" id="loginPassword" required placeholder="••••••••••••" 
                   class="w-full pl-10 pr-11 py-3 rounded-lg text-sm input-dark">
            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition">
              👁️
            </button>
          </div>
        </div>

        <div class="flex items-center">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 bg-slate-900 border-slate-700">
          <label for="rememberMe" class="ml-2 text-xs text-slate-300">Recordar usuario en este dispositivo</label>
        </div>

        <!-- BOTÓN PRINCIPAL -->
        <button type="submit" id="btnSubmit" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-lg text-sm transition shadow-lg shadow-emerald-600/20 cursor-pointer flex justify-center items-center gap-2">
          <span>Ingresar al Portal</span>
        </button>

        <!-- AVISO CORPORATIVO DISCRETO -->
        <div class="pt-5 border-t border-slate-800 text-center">
          <div class="inline-flex items-center gap-2 p-3 rounded-lg bg-slate-900/60 border border-slate-800 text-xs text-slate-400">
            <span>🔒</span>
            <span>Acceso restringido al personal autorizado. Contactar a Soporte TI para altas.</span>
          </div>
        </div>
      </form>

    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="toast-notification hidden">
      <span class="toast-icon">⚠️</span>
      <span id="toastMessage">Error message</span>
  </div>

  <script>
    function togglePassword() {
      const pass = document.getElementById('loginPassword');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    function showToast(message) {
        const toast = document.getElementById('toastNotification');
        const toastMsg = document.getElementById('toastMessage');
        toastMsg.textContent = message;
        toast.classList.remove('hidden');
        // Reflow
        void toast.offsetWidth;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.classList.add('hidden'), 300);
        }, 4000);
    }

    // Auto-fill saved email if available
    window.addEventListener('DOMContentLoaded', () => {
        const savedEmail = localStorage.getItem('savedEmail');
        if (savedEmail) {
            document.getElementById('loginEmail').value = savedEmail;
            document.getElementById('rememberMe').checked = true;
        }
    });

    const loginForm = document.getElementById('loginForm');
    
    // ==========================================
    // LÓGICA DE LOGIN (Conectada a Neon DB)
    // ==========================================
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const submitBtn = document.getElementById('btnSubmit');

        // Efecto de carga en el botón
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Verificando...</span>';
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

        try {
            // Llamada a tu API en Vercel
            const response = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo: email, password: password })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // Traducir el rol de la base de datos al frontend
                const userRole = data.user.rol === 'Administrador' ? 'admin' : 'viewer';

                // Guardar los datos del usuario extraídos de Neon PostgreSQL
                const session = { 
                    id: data.user.id_usuario,
                    name: data.user.nombre, 
                    role: userRole, 
                    token: 'auth-' + Date.now() 
                };
                
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('savedEmail', email);
                } else {
                    localStorage.removeItem('savedEmail');
                }
                localStorage.setItem('session', JSON.stringify(session));
                window.location.replace('dashboard.html');
            } else {
                showToast(data.message || 'Correo o contraseña incorrectos.');
            }
        } catch (error) {
            showToast('Hubo un problema al conectar con el servidor. Revisa tu conexión.');
            console.error('Error de fetch:', error);
        } finally {
            // Restaurar el botón independientemente del resultado
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    });
  </script>
</body>
</html>
