<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportería e Inventario - Agrícola Avanti</title>
  <link rel="icon" type="image/jpeg" href="/AVANTI%20LOGO%20(1).jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg-deep: #0F172A;
      --surface-slate: #1E293B;
      --border-subtle: #334155;
      --text-bright: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-green: #10B981;
    }

    body { background-color: var(--bg-deep); font-family: 'Inter', system-ui, sans-serif; color: var(--text-bright); }
    
    .neo-panel { background-color: var(--surface-slate); border: 1px solid var(--border-subtle); border-radius: 12px; box-shadow: none; }
    .neo-input { background-color: var(--bg-deep) !important; border: 1px solid var(--border-subtle) !important; color: var(--text-bright) !important; transition: border-color 0.2s ease; }
    .neo-input:focus { border-color: var(--accent-green) !important; outline: none; }

    /* CORE: DOMINIO TOTAL SOBRE TABULATOR PARA EVITAR EL FONDO BLANCO */
    .tabulator { border: none !important; background-color: transparent !important; font-size: 13.5px; }
    .tabulator-header { background-color: var(--bg-deep) !important; border-bottom: 1px solid var(--border-subtle) !important; }
    .tabulator-col { background-color: transparent !important; border-right: none !important; padding: 14px 6px !important; }
    .tabulator-col-title { color: var(--text-muted) !important; font-weight: 600 !important; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
    
    /* Reglas estrictas para Zebra Striping sin transparencias que fallen */
    .tabulator-row, .tabulator-row.tabulator-row-odd { background-color: var(--surface-slate) !important; border-bottom: 1px solid var(--border-subtle) !important; transition: background-color 0.2s ease; }
    .tabulator-row.tabulator-row-even { background-color: #141C2B !important; border-bottom: 1px solid var(--border-subtle) !important; transition: background-color 0.2s ease; }
    .tabulator-row:hover { background-color: #27364B !important; cursor: pointer; }
    .tabulator-cell { border-right: none !important; padding: 18px 12px !important; vertical-align: middle !important; color: var(--text-bright) !important;}
    
    /* Paginador (Footer) adaptado al Dark Mode */
    .tabulator-footer { background-color: var(--bg-deep) !important; border-top: 1px solid var(--border-subtle) !important; color: var(--text-muted) !important; padding: 10px !important; }
    .tabulator-footer .tabulator-page-size { background-color: var(--surface-slate); border: 1px solid var(--border-subtle); color: var(--text-bright); border-radius: 6px; padding: 4px 8px; outline: none; }
    .tabulator-footer .tabulator-page { background: transparent !important; border: 1px solid transparent !important; color: var(--text-muted) !important; border-radius: 6px; margin: 0 2px; transition: all 0.2s; }
    .tabulator-footer .tabulator-page:hover { background: var(--surface-slate) !important; color: var(--text-bright) !important; }
    .tabulator-footer .tabulator-page.active { background: var(--surface-slate) !important; color: var(--accent-green) !important; border: 1px solid var(--border-subtle) !important; font-weight: bold; }

    /* Indicadores de estado tipo píldora */
    .tab-badge { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 9999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; background-color: transparent; border: 1px solid var(--border-subtle); color: var(--text-bright); }
    .tab-badge::before { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; }
    .t-op::before { background-color: #10B981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    .t-ret::before { background-color: #EF4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    .t-stk::before { background-color: #38BDF8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }

    /* BOTONES DE ACCIÓN: Estilo 'Ghost' limpio */
    .action-btn { 
      display: inline-flex; align-items: center; justify-content: center; 
      width: 36px; height: 36px; border-radius: 8px; 
      border: 1px solid transparent; /* Sin borde por defecto */
      background-color: transparent; /* Sin fondo por defecto */
      color: #64748B; /* Gris muy tenue */
      transition: all 0.2s ease; cursor: pointer; 
    }
    .action-btn svg { width: 18px; height: 18px; transition: stroke-width 0.2s; }
    
    /* Estados Hover (Se encienden al pasar el cursor) */
    .btn-pdf:hover { color: #10B981; background-color: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); }
    .btn-pdf:hover svg { stroke-width: 2.5px; }
    
    .btn-evi:hover { color: #38BDF8; background-color: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3); }
    .btn-evi:hover svg { stroke-width: 2.5px; }
    
    .btn-del:hover { color: #EF4444; background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); }
    .btn-del:hover svg { stroke-width: 2.5px; }
    
    .btn-disabled { color: var(--border-subtle) !important; cursor: not-allowed; opacity: 0.3; }

    .btn-outline { background-color: var(--bg-deep); border: 1px solid var(--border-subtle); color: var(--text-bright); transition: border-color 0.2s; }
    .btn-outline:hover { border-color: var(--text-muted); }

    /* Scrollbar sutil */
    .tabulator-tableholder::-webkit-scrollbar { height: 8px; width: 8px; }
    .tabulator-tableholder::-webkit-scrollbar-track { background: var(--bg-deep); }
    .tabulator-tableholder::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
    .tabulator-tableholder::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-[1400px] mx-auto space-y-6">
    
    <!-- CABECERA -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-6 neo-panel">
      <div class="flex items-center gap-4">
        <div class="p-2 bg-white rounded-lg shadow-none border border-[#334155]">
          <img src="/AVANTI%20LOGO%20(1).jpeg" alt="Logo" class="w-10 h-10 object-contain">
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-[#F8FAFC]">Control de TI</h1>
          <p class="text-sm font-medium mt-0.5 text-[#94A3B8]">Gestión de inventario e impresión de actas</p>
        </div>
      </div>
      <div class="mt-4 md:mt-0 flex w-full md:w-auto gap-3">
        <button class="w-full md:w-auto flex items-center justify-center gap-2 btn-outline font-medium py-2.5 px-5 rounded-lg text-sm transition" onclick="location.href='dashboard.html'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          Volver
        </button>
      </div>
    </div>

    <!-- PANEL DE FILTROS -->
    <div class="p-6 neo-panel">
      <div class="flex flex-col lg:flex-row gap-5 items-end">
        <div class="flex-1 w-full">
          <label class="block text-xs font-semibold uppercase tracking-wide mb-2 text-[#94A3B8]">Código o Serie</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-[#94A3B8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input type="text" id="filtro-computador" class="w-full rounded-lg pl-10 pr-4 py-3 text-sm neo-input">
          </div>
        </div>
        
        <div class="flex-1 w-full">
          <label class="block text-xs font-semibold uppercase tracking-wide mb-2 text-[#94A3B8]">Empleado Asignado</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-[#94A3B8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <input type="text" id="filtro-usuario" class="w-full rounded-lg pl-10 pr-4 py-3 text-sm neo-input">
          </div>
        </div>

        <div class="flex-1 w-full">
          <label class="block text-xs font-semibold uppercase tracking-wide mb-2 text-[#94A3B8]">Categoría</label>
          <select id="filtro-categoria" class="w-full rounded-lg px-4 py-3 text-sm neo-input appearance-none">
            <option value="">Todas</option>
            <option value="PCs">PCs</option>
            <option value="Teléfono Móvil">Teléfono Móvil</option>
            <option value="Periférico">Periférico</option>
            <option value="Línea Móvil">Línea Móvil</option>
          </select>
        </div>

        <div class="w-full lg:w-auto mt-2 lg:mt-0">
          <button id="btn-limpiar" class="flex items-center justify-center w-full lg:w-auto btn-outline font-medium py-3 px-6 rounded-lg text-sm transition">
            Resetear Filtros
          </button>
        </div>
      </div>
    </div>

    <!-- CONTENEDOR DEL GRID -->
    <div class="neo-panel overflow-hidden p-0 border border-[#334155]">
      <div id="inventario-grid" class="w-full"></div>
    </div>

  </div>

  <!-- MODAL DE EVIDENCIA -->
  <div id="evidencia_modal" class="fixed inset-0 bg-black bg-opacity-80 backdrop-blur-sm z-[9999] hidden items-center justify-center p-4 transition-opacity">
    <div class="neo-panel max-w-4xl w-full overflow-hidden flex flex-col shadow-2xl">
      <div class="px-6 py-4 flex justify-between items-center border-b border-[#334155] bg-[#0F172A]">
        <h3 class="font-bold text-lg flex items-center gap-2 text-[#F8FAFC]">
          <svg class="w-5 h-5 text-[#10B981]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          Evidencia Fotográfica
        </h3>
        <button onclick="cerrarModalEvidencia()" class="text-[#94A3B8] hover:text-[#10B981] transition-colors outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-6 flex justify-center items-center bg-[#1E293B]" style="min-height: 50vh;">
        <img id="evidencia_img_full" src="" alt="Evidencia" class="max-h-[65vh] object-contain rounded-lg border border-[#334155] bg-[#0F172A] p-2">
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let tablaInventario;
    const sessionData = JSON.parse(localStorage.getItem('session') || '{}');
    const isGuest = sessionData.role === 'viewer';

    function abrirModalEvidencia(base64Src) {
      if (!base64Src) return;
      document.getElementById('evidencia_img_full').src = base64Src;
      document.getElementById('evidencia_modal').style.display = 'flex';
    }

    function cerrarModalEvidencia() {
      document.getElementById('evidencia_modal').style.display = 'none';
      document.getElementById('evidencia_img_full').src = "";
    }

    document.getElementById('evidencia_modal').addEventListener('click', function(e) {
      if(e.target === this) cerrarModalEvidencia();
    });

    const iconPDF = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;
    const iconCamera = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`;
    const iconTrash = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('inventario-grid').innerHTML = "<div class='flex flex-col items-center justify-center p-16 text-[#94A3B8]'><svg class='animate-spin h-8 w-8 mb-4 text-[#10B981]' xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24'><circle class='opacity-25' cx='12' cy='12' r='10' stroke='currentColor' stroke-width='4'></circle><path class='opacity-75' fill='currentColor' d='M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z'></path></svg><p class='font-medium'>Sincronizando con la Base de Datos...</p></div>";

      try {
        const response = await fetch('/api/obtener-metricas');
        if (!response.ok) throw new Error('Error de red al consultar a la API');
        const data = await response.json();

        data.inventario_total = data.inventario_total.map(item => {
            if (item.categoria === 'Material Informático') item.categoria = 'PCs';
            return item;
        });

        tablaInventario = new Tabulator("#inventario-grid", {
          data: data.inventario_total, 
          layout: "fitColumns", 
          responsiveLayout: "collapse",
          pagination: "local",
          paginationSize: 10,
          paginationSizeSelector: [10, 25, 50, 100],
          columns: [
            {
              title: "Acciones", 
              minWidth: 150, 
              hozAlign: "center",
              headerSort: false,
              formatter: function(cell) {
                const row = cell.getRow().getData();
                let html = '<div class="flex items-center justify-center gap-1.5">';
                
                if(row.id_acta) html += `<button class='action-btn btn-pdf' title='Ver Acta PDF'>${iconPDF}</button>`;
                else html += `<button class='action-btn btn-disabled' disabled>${iconPDF}</button>`;

                if ((row.evidencia_entrega && row.evidencia_entrega.length > 50) || (row.evidencia_devolucion && row.evidencia_devolucion.length > 50)) {
                  html += `<button class='action-btn btn-evi' title='Ver Evidencia Fotográfica'>${iconCamera}</button>`;
                } else {
                  html += `<button class='action-btn btn-disabled' disabled>${iconCamera}</button>`;
                }

                if(isGuest) {
                  html += `<button class='action-btn btn-disabled' title='Acceso Denegado' disabled>${iconTrash}</button>`;
                } else {
                  html += `<button class='action-btn btn-del' title='Eliminar de Base de Datos'>${iconTrash}</button>`;
                }

                html += '</div>';
                return html;
              },
              cellClick: function(e, cell) {
                const rowData = cell.getRow().getData();
                
                if(e.target.closest('.btn-pdf')) {
                  sessionStorage.setItem('acta_imprimir', JSON.stringify(rowData));
                  window.open(`gestion-actas.html?vista=${rowData.tipo_vista}&print=true`, '_blank');
                }
                
                if(e.target.closest('.btn-evi')) {
                  if(rowData.evidencia_devolucion && rowData.evidencia_devolucion.length > 50) {
                    abrirModalEvidencia(rowData.evidencia_devolucion);
                  } else {
                    abrirModalEvidencia(rowData.evidencia_entrega);
                  }
                }

                if(e.target.closest('.btn-del') && !isGuest) {
                  if(confirm("⚠️ ¿Estás completamente seguro de eliminar este registro?\n\nEsta acción borrará el equipo del inventario de manera irreversible.")) {
                     eliminarRegistro(rowData, cell.getRow());
                  }
                }
              }
            },
            { 
              title: "Categoría", 
              field: "categoria", 
              minWidth: 140, 
              formatter: cell => `<span class="inline-flex items-center px-3 py-1.5 rounded-lg text-[11px] font-bold tracking-wider uppercase bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${cell.getValue()}</span>` 
            },
            { 
              title: "Empleado", 
              field: "nombre_empleado", 
              minWidth: 260, 
              formatter: function(cell) {
                let name = cell.getValue();
                let email = cell.getRow().getData().correo_corp || "Sin correo asignado";
                if(!name) return `<span class="italic text-[#64748B] font-light">No asignado</span>`;
                return `<div class="font-medium text-[#F8FAFC] tracking-wide whitespace-normal break-words leading-snug">${name}</div><div class="text-xs mt-1 text-[#94A3B8] font-light break-words">${email}</div>`;
              }
            },
            { 
              title: "Departamento", 
              field: "area", 
              minWidth: 160, 
              formatter: cell => `<span class="text-[#E2E8F0] whitespace-normal break-words">${cell.getValue() || "-"}</span>` 
            },
            { 
              title: "CPU", 
              field: "computador", 
              minWidth: 130, 
              formatter: cell => `<span class="text-[#94A3B8] font-mono text-xs whitespace-normal break-words">${cell.getValue() || "-"}</span>` 
            },
            { 
              title: "Nº Serie", 
              field: "numero_serie", 
              minWidth: 140, 
              formatter: cell => `<span class="text-[#94A3B8] font-mono text-xs whitespace-normal break-words">${cell.getValue() || "-"}</span>` 
            },
            { 
              title: "Marca y Modelo", 
              field: "marca_modelo", 
              minWidth: 260, 
              formatter: function(cell) {
                let text = cell.getValue();
                return text ? `<div class="w-full text-[#E2E8F0] whitespace-normal break-words leading-snug">${text}</div>` : "-";
              }
            },
            { 
              title: "Estado", 
              field: "estado_operativo", 
              minWidth: 140,
              hozAlign: "left",
              formatter: function(cell) {
                const val = cell.getValue();
                if(!val) return "";
                if(val === 'OPERATIVO' || val === 'ACTIVA') return `<span class="tab-badge t-op">Activo</span>`;
                if(val === 'RETIRADO' || val === 'SUSPENDIDA') return `<span class="tab-badge t-ret">Inactivo</span>`;
                return `<span class="tab-badge t-stk">Stock</span>`;
              }
            }
          ]
        });

      } catch (error) {
        document.getElementById('inventario-grid').innerHTML = `<div class='neo-panel border-[#EF4444] text-[#EF4444] p-4 mx-auto max-w-lg mt-10 text-center font-medium shadow-sm'>Error al cargar inventario: ${error.message}</div>`;
      }
    });

    async function eliminarRegistro(rowData, rowNode) {
      if (isGuest) return alert('Modo solo lectura.');
      try {
        const res = await fetch('/api/eliminar-registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(rowData)
        });
        
        const data = await res.json();
        if (res.ok && data.success) {
          rowNode.delete(); 
          alert("✅ El equipo ha sido eliminado del sistema con éxito.");
        } else {
          alert("❌ Hubo un error al eliminar: " + data.error);
        }
      } catch(e) {
        alert("❌ Error de red. No se pudo conectar con el servidor Neon.");
      }
    }

    function actualizarFiltros() {
      const valComputador = document.getElementById("filtro-computador").value;
      const valUsuario = document.getElementById("filtro-usuario").value;
      const valCategoria = document.getElementById("filtro-categoria").value;

      tablaInventario.setFilter([
        { field: "computador", type: "like", value: valComputador },
        { field: "nombre_empleado", type: "like", value: valUsuario },
        { field: "categoria", type: "like", value: valCategoria }
      ]);
    }

    document.getElementById("filtro-computador").addEventListener("keyup", actualizarFiltros);
    document.getElementById("filtro-usuario").addEventListener("keyup", actualizarFiltros);
    document.getElementById("filtro-categoria").addEventListener("change", actualizarFiltros);

    document.getElementById("btn-limpiar").addEventListener("click", () => {
      document.getElementById("filtro-computador").value = "";
      document.getElementById("filtro-usuario").value = "";
      document.getElementById("filtro-categoria").value = "";
      tablaInventario.clearFilter();
    });
  </script>
</body>
</html>
