<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Personal - Avanti</title>
  <link rel="icon" type="image/jpeg" href="/AVANTI%20LOGO%20(1).jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>

  <style>

    :root {
      --bg-deep: #0a0a0c;
      --surface-slate: #131416;
      --border-subtle: #222222;
      --border-focus: #333333;
      --text-bright: #ffffff;
      --text-muted: #a1a1aa;
      --accent-green: #00c867;
      --accent-green-hover: #00b05b;
    }

    body { 
        background-color: var(--bg-deep); 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        color: var(--text-bright); 
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }
    
    .neo-panel { 
        background-color: var(--surface-slate); 
        border: 1px solid var(--border-subtle); 
        border-radius: 16px; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }
    
    /* Inputs de Alta Definicin (input-pro) */
    .neo-input { 
        background-color: transparent !important; 
        border: 1px solid var(--border-focus) !important; 
        color: #F8FAFC !important; 
        transition: all 0.15s ease-in-out; 
    }
    .neo-input:hover { border-color: #3f3f46 !important; }
    .neo-input:focus { 
        border-color: var(--accent-green) !important; 
        background-color: #18181b !important; 
        outline: none; 
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); 
    }

    /* CORE: TABULATOR Y SCROLL (Vercel Aesthetic) */
    .tabulator { border: none !important; background-color: transparent !important; font-size: 14px; height: auto !important; }
    .tabulator-tableholder { overflow-y: hidden !important; overflow-x: auto !important; height: auto !important; }
    
    .tabulator-header { 
        background-color: var(--surface-slate) !important; 
        color: var(--text-muted) !important; 
        border-bottom: 1px solid var(--border-subtle) !important; 
    }
    .tabulator-col { background-color: transparent !important; border-right: none !important; padding: 16px 12px !important; }
    .tabulator-col-title { font-weight: 600 !important; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);}
    
    .tabulator-row { border-bottom: 1px solid var(--border-subtle) !important; transition: background-color 0.15s ease; }
    .tabulator-row.tabulator-row-odd { background-color: transparent !important; }
    .tabulator-row.tabulator-row-even { background-color: #0f0f11 !important; }
    .tabulator-row:hover { background-color: #18181b !important; cursor: pointer; }
    .tabulator-cell { border-right: none !important; padding: 18px 16px !important; vertical-align: middle !important; color: var(--text-bright) !important;}
    
    /* VISTA MVIL PREMIUM */
    .tabulator-row .tabulator-responsive-collapse { background-color: var(--surface-slate) !important; padding: 20px !important; border-bottom: 1px solid var(--border-subtle) !important; }
    .tabulator-row .tabulator-responsive-collapse table { width: 100%; display: block; }
    .tabulator-row .tabulator-responsive-collapse table tbody { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    .tabulator-row .tabulator-responsive-collapse table tr { display: flex; flex-direction: column; background: var(--surface-slate); padding: 16px; border-radius: 12px; border: 1px solid var(--border-subtle); }
    .tabulator-row .tabulator-responsive-collapse table tr td { border: none !important; padding: 0 !important; display: block; text-align: left !important; }
    .tabulator-row .tabulator-responsive-collapse table tr td:first-of-type { font-size: 11px !important; color: var(--text-muted) !important; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; background: transparent !important; width: 100% !important; border: none !important; }
    .tabulator-row .tabulator-responsive-collapse table tr td:last-of-type { font-size: 14px !important; width: 100% !important; padding: 0 !important; }
    .tabulator-row .tabulator-responsive-collapse table tr td:last-of-type > div { justify-content: flex-start !important; text-align: left !important; }

    .tabulator-footer { background-color: var(--surface-slate) !important; border-top: 1px solid var(--border-subtle) !important; color: var(--text-muted) !important; padding: 16px !important;}
    .tabulator-footer .tabulator-page-size { background-color: transparent; border: 1px solid var(--border-focus); color: var(--text-bright); border-radius: 8px; padding: 6px 12px; outline: none; transition: border 0.2s;}
    .tabulator-footer .tabulator-page-size:focus { border-color: var(--accent-green); }
    .tabulator-footer .tabulator-page { background: transparent !important; border: 1px solid transparent !important; color: var(--text-muted) !important; border-radius: 8px; margin: 0 4px; padding: 6px 12px !important; transition: all 0.2s; font-weight: 500;}
    .tabulator-footer .tabulator-page:hover { background: #1a1a1c !important; color: var(--text-bright) !important; }
    .tabulator-footer .tabulator-page.active { background: var(--accent-green) !important; color: white !important; border: 1px solid transparent !important; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3); }

    /* BOTONES ACCIN EN TABLA */
    .action-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-muted); transition: all 0.15s ease; cursor: pointer; }
    .btn-del:hover { color: #F87171; background-color: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.2); }
    .btn-edit:hover { color: #38BDF8; background-color: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.2); }
    
    /* BOTONES PRINCIPALES */
    .btn-primary { 
        background-color: var(--accent-green); 
        color: #fff; 
        border: 1px solid transparent; 
        transition: all 0.15s ease-in-out; 
        box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
    }
    .btn-primary:hover { background-color: var(--accent-green-hover); box-shadow: 0 6px 8px -1px rgba(16, 185, 129, 0.4); }
    .btn-primary:active { transform: scale(0.98); }
    
    .btn-outline { 
        background-color: transparent; 
        border: 1px solid var(--border-focus); 
        color: var(--text-bright); 
        transition: all 0.15s ease-in-out; 
    }
    .btn-outline:hover { border-color: var(--text-muted); background-color: rgba(255, 255, 255, 0.05); }
    .btn-outline:active { transform: scale(0.98); }

  
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; border: 2px solid var(--bg-deep); }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-[1200px] mx-auto space-y-6">
    <!-- HEADER PRINCIPAL -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-6 neo-panel gap-4">
      <div class="flex items-center gap-5">
        <div class="p-3.5 bg-[var(--surface-slate)] rounded-xl border border-[var(--border-subtle)] shadow-sm flex items-center justify-center">
          <svg class="w-7 h-7 text-[#10B981]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight text-[var(--text-bright)]">Directorio de Personal</h1>
          <p class="text-sm font-medium mt-1 text-[var(--text-muted)]">Gestión de empleados para asignación de equipos</p>
          <div class="flex items-center gap-2 mt-2.5">
            <span class="flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <p id="record-counter" class="text-[11px] font-bold text-[#10B981] uppercase tracking-wider">Cargando...</p>
          </div>
        </div>
      </div>
      
      <div class="flex w-full md:w-auto gap-3 shrink-0">
        <button onclick="location.href='dashboard.html'" class="flex-1 md:flex-none flex items-center justify-center gap-2 btn-outline font-semibold py-2.5 px-6 rounded-lg text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          Volver
        </button>
        <button id="btn-add-empleado" onclick="abrirModalNuevo()" class="flex-1 md:flex-none flex items-center justify-center gap-2 btn-primary font-semibold py-2.5 px-6 rounded-lg text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Añadir Empleado
        </button>
      </div>
    </div>

    <!-- PANEL DE FILTROS -->
    <div class="p-6 neo-panel flex flex-col md:flex-row gap-5 items-end mt-6 mb-6">
        <div class="w-full flex-1">
            <label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Búsqueda Global</label>
            <div class="relative">
                <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--text-muted)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="global-search" placeholder="Buscar por DNI, nombre, cargo..." class="w-full pl-10 pr-4 py-2.5 rounded-lg text-sm neo-input focus:ring-0">
            </div>
        </div>
        <div class="w-full sm:w-64">
            <label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Filtrar por Área</label>
            <select id="area-filter" class="w-full px-4 py-2.5 rounded-lg text-sm neo-input focus:ring-0">
                <option value="">Todas las Áreas</option>
                <option value="Administración">Administración</option>
                <option value="Contabilidad">Contabilidad</option>
                <option value="Sistemas">Sistemas</option>
                <option value="Gestión Humana">Gestión Humana</option>
                <option value="Operaciones">Operaciones</option>
                <option value="Campo General">Campo General</option>
                <option value="Salud">Salud</option>
                <option value="Adquisiciones Y Servicios">Adquisiciones Y Servicios</option>
                <option value="Seguridad Industrial">Seguridad Industrial</option>
            </select>
        </div>
    </div>

    <div class="neo-panel overflow-hidden p-0">
      <div id="empleados-grid" class="w-full"></div>
    </div>
  </div>

  <div id="modal-empleado" class="fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm z-[9999] hidden flex items-center justify-center p-4">
    <div class="neo-panel max-w-lg w-full overflow-hidden">
      <div class="px-6 py-5 flex justify-between items-center border-b border-[var(--border-focus)] bg-[var(--surface-slate)]">
        <h3 id="modal-title" class="font-bold text-lg text-[var(--text-bright)]">Registrar Nuevo Empleado</h3>
        <button onclick="document.getElementById('modal-empleado').classList.add('hidden')" class="text-[var(--text-muted)] hover:text-[#10B981] transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <form id="form-empleado" class="p-6 space-y-5 bg-[#1a1a1c]">
        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold uppercase mb-1.5 text-[var(--text-muted)]">DNI *</label>
            <input type="text" id="emp-dni" required class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase mb-1.5 text-[var(--text-muted)]">Centro Costo</label>
            <input type="text" id="emp-cc" class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase mb-1.5 text-[var(--text-muted)]">Nombre Completo *</label>
          <input type="text" id="emp-nombre" required class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
        </div>
        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold uppercase mb-1.5 text-[var(--text-muted)]">Área / Departamento *</label>
            <input type="text" id="emp-area" required class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase mb-1.5 text-[var(--text-muted)]">Cargo / Puesto *</label>
            <input type="text" id="emp-cargo" required class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase mb-1.5 text-[var(--text-muted)]">Correo Corporativo</label>
          <input type="email" id="emp-correo" class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
        </div>
        <div class="pt-5 flex justify-end gap-3 border-t border-[var(--border-focus)] mt-4">
          <button type="button" onclick="document.getElementById('modal-empleado').classList.add('hidden')" class="btn-outline px-5 py-2.5 rounded-lg font-medium text-sm">Cancelar</button>
          <button type="submit" id="btn-save-emp" class="btn-primary px-5 py-2.5 rounded-lg font-medium text-sm">Guardar Empleado</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function toCapitalize(str) {
        if (!str) return '';
        return str.toUpperCase(); // Para estandarizar con los registros actuales
    }

    let tablaEmpleados;
    let equipByEmp = {};
    let historialByEmp = {};
    let editEmpleadoId = null; // Variable Global para saber si editamos o creamos
    
    const sessionData = JSON.parse(localStorage.getItem('session') || '{}');
    const isGuest = sessionData.role === 'viewer';

    if (isGuest) {
      document.getElementById('btn-add-empleado').style.display = 'none';
    }


    function exportarCSV() {
        if(tablaEmpleados) {
            tablaEmpleados.download("csv", "directorio_avanti.csv");
        }
    }

    function abrirModalHistorial(rowData) {
        document.getElementById('historial-nombre').innerText = rowData.nombre_completo;
        document.getElementById('historial-dni').innerText = "DNI / Documento: " + rowData.dni;
        
        const actas = historialByEmp[rowData.dni] || [];
        const content = document.getElementById('historial-content');
        
        if (actas.length === 0) {
            content.innerHTML = '<div class="text-center text-gray-500 py-6">No hay historial de actas para este empleado.</div>';
        } else {
            let html = '';
            actas.forEach(a => {
                const isActive = !a.fecha_devolucion;
                const statusBadge = isActive 
                    ? '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded text-xs font-semibold">ACTIVO</span>'
                    : '<span class="bg-gray-500/10 text-gray-400 border border-gray-500/20 px-2 py-0.5 rounded text-xs font-semibold">DEVUELTO</span>';
                
                html += `
                <div class="bg-[var(--surface-slate)] border border-[var(--border-focus)] p-4 rounded-lg flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-semibold text-white text-sm">${a.categoria}</p>
                            <p class="text-xs text-gray-400 mt-1">S/N: ${a.numero_serie || a.numero_telefono || 'N/A'}</p>
                        </div>
                        ${statusBadge}
                    </div>
                    <div class="text-xs text-gray-500 mt-2">
                        <p>ID Acta: ${a.id_acta}</p>
                        <p>Entrega: ${a.fecha_entrega ? new Date(a.fecha_entrega).toLocaleDateString() : 'N/A'}</p>
                        ${a.fecha_devolucion ? `<p>Devolución: ${new Date(a.fecha_devolucion).toLocaleDateString()}</p>` : ''}
                    </div>
                </div>`;
            });
            content.innerHTML = html;
        }
        
        document.getElementById('modal-historial').classList.remove('hidden');
    }

    // Preparar el modal para Crear

    function abrirModalNuevo() {
        editEmpleadoId = null;
        document.getElementById('form-empleado').reset();
        document.getElementById('modal-title').innerText = 'Registrar Nuevo Empleado';
        document.getElementById('modal-empleado').classList.remove('hidden');
    }

    // Preparar el modal para Editar
    function abrirModalEditar(rowData) {
        editEmpleadoId = rowData.id_empleado;
        document.getElementById('emp-dni').value = rowData.dni || '';
        document.getElementById('emp-nombre').value = rowData.nombre_completo || '';
        document.getElementById('emp-area').value = rowData.area || '';
        document.getElementById('emp-cargo').value = rowData.cargo || '';
        document.getElementById('emp-correo').value = rowData.correo_corp || '';
        document.getElementById('emp-cc').value = rowData.centro_costo || '';
        
        document.getElementById('modal-title').innerText = 'Editar Empleado';
        document.getElementById('modal-empleado').classList.remove('hidden');
    }

    async function cargarEmpleados() {
      try {
        const res = await fetch('/api/empleados');
        const data = await res.json();
        
        if(tablaEmpleados) {
            tablaEmpleados.setData(data.data);
            return;
        }

        let cols = [
            { title: "DNI", field: "dni", minWidth: 120, hozAlign: "center", headerHozAlign: "center", formatter: cell => `<div class="w-full flex items-center justify-center h-full text-[var(--text-muted)] font-mono text-xs">${cell.getValue()}</div>` },
            { title: "Empleado", field: "nombre_completo", minWidth: 260, hozAlign: "left", headerHozAlign: "left", formatter: cell => {
                let name = cell.getValue();
                let email = cell.getRow().getData().correo_corp || "Sin correo corporativo";
                return `<div class="w-full flex flex-col justify-center h-full text-left"><div class="font-medium text-[var(--text-bright)] tracking-wide whitespace-normal break-words leading-relaxed text-justify">${name}</div><div class="text-xs mt-1 text-[var(--text-muted)] font-light break-words">${email}</div></div>`;
              }
            },
            { title: "Área", field: "area", minWidth: 180, hozAlign: "left", headerHozAlign: "left", formatter: cell => `<div class="w-full flex items-center h-full text-left text-[var(--text-bright)] whitespace-normal break-words leading-relaxed text-justify">${cell.getValue()}</div>` },
            { title: "Cargo", field: "cargo", minWidth: 180, hozAlign: "left", headerHozAlign: "left", formatter: cell => `<div class="w-full flex items-center h-full text-left text-[#CBD5E1] font-light whitespace-normal break-words leading-relaxed text-justify">${cell.getValue()}</div>` }
        ];

        if (!isGuest) {
            cols.push({ 
              title: "Acciones", minWidth: 120, hozAlign: "center", headerHozAlign: "center", headerSort: false,
              formatter: () => `<div class="w-full flex justify-center items-center gap-2 h-full">
                <button class='action-btn btn-edit' title='Editar Empleado'><svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                <button class='action-btn btn-del' title='Eliminar Empleado'><svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
              </div>`,
              cellClick: async function(e, cell) {
                const rowData = cell.getRow().getData();
                
                // Acción Editar
                if(e.target.closest('.btn-edit')) {
                    abrirModalEditar(rowData);
                }
                
                // Acción Eliminar
                if(e.target.closest('.btn-del')) {
                  if(confirm("¿Estás seguro de eliminar este empleado del directorio?\n\nSi el empleado tiene equipos asignados, estos quedarán 'sin asignar' en el inventario.")) {
                    try {
                        const response = await fetch('/api/empleados', { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id_empleado: rowData.id_empleado}) });
                        const data = await response.json();
                        if (response.ok && data.success) cell.getRow().delete();
                        else alert("❌ Error al eliminar: " + (data.error || 'Problema desconocido.'));
                    } catch(err) { alert("❌ Error de red."); }
                  }
                }
              }
            });
        }

        
        tablaEmpleados = new Tabulator("#empleados-grid", {
          data: data.data,
          layout: "fitColumns",
          responsiveLayout: "collapse",
          pagination: "local",
          paginationSize: 50,
          columnDefaults: { vertAlign: "middle" },
          columns: cols
        });

        // ==========================================
        // LÓGICA DE FILTROS SUPERIORES (Vercel Style)
        // ==========================================
        function updateTableFilters() {
            let searchVal = document.getElementById("global-search").value.toLowerCase();
            let areaVal = document.getElementById("area-filter").value;
            
            let filters = [];
            if(areaVal) {
                filters.push({field:"area", type:"=", value:areaVal});
            }
            
            tablaEmpleados.setFilter(filters);
            
            if (searchVal) {
                tablaEmpleados.addFilter(function(data){
                    return (data.dni && data.dni.toLowerCase().includes(searchVal)) ||
                           (data.nombre_completo && data.nombre_completo.toLowerCase().includes(searchVal)) ||
                           (data.cargo && data.cargo.toLowerCase().includes(searchVal));
                });
            }
        }

        document.getElementById("global-search").addEventListener("input", updateTableFilters);
        document.getElementById("area-filter").addEventListener("change", updateTableFilters);

      } catch (err) { console.error("Error cargando empleados:", err); }
    }

    cargarEmpleados();

    document.getElementById('form-empleado').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isGuest) return alert('Modo solo lectura.');

      const btn = document.getElementById('btn-save-emp');
      btn.innerText = "Guardando...";
      
            const dni = document.getElementById('emp-dni').value.replace(/\s+/g, '').trim();
      const cc = document.getElementById('emp-cc').value.replace(/\s+/g, ' ').trim().toUpperCase();
      const nombre = toCapitalize(document.getElementById('emp-nombre').value.replace(/\s+/g, ' ').trim());
      const area = toCapitalize(document.getElementById('emp-area').value.replace(/\s+/g, ' ').trim());
      const cargo = toCapitalize(document.getElementById('emp-cargo').value.replace(/\s+/g, ' ').trim());
      const correo = document.getElementById('emp-correo').value.replace(/\s+/g, '').trim().toLowerCase();

      const payload = {
        id_empleado: editEmpleadoId,
        dni: dni,
        nombre_completo: nombre,
        area: area,
        cargo: cargo,
        correo_corp: correo,
        centro_costo: cc
      };

      // Si existe editEmpleadoId hacemos PUT, sino POST
      const requestMethod = editEmpleadoId ? 'PUT' : 'POST';

      try {
        const res = await fetch('/api/empleados', { 
            method: requestMethod, 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(payload) 
        });
        
        if (res.ok) { 
            document.getElementById('modal-empleado').classList.add('hidden'); 
            document.getElementById('form-empleado').reset(); 
            cargarEmpleados(); // Recargar la tabla completa
        } else { 
            alert("Error al guardar el empleado."); 
        }
      } catch (err) { 
          alert("Error de conexión."); 
      } finally { 
          btn.innerText = "Guardar Empleado"; 
      }
    });
  </script>

  <div id="modal-historial" class="fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm z-[9999] hidden flex items-center justify-center p-4">
    <div class="neo-panel max-w-2xl w-full overflow-hidden flex flex-col max-h-[85vh]">
      <div class="px-6 py-5 flex justify-between items-center border-b border-[var(--border-focus)] bg-[var(--surface-slate)] shrink-0">
        <h3 class="font-bold text-lg text-[var(--text-bright)]">Historial del Empleado</h3>
        <button onclick="document.getElementById('modal-historial').classList.add('hidden')" class="text-[var(--text-muted)] hover:text-[#10B981] transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-6 bg-[#1a1a1c] overflow-y-auto flex-1">
        <div class="mb-4">
            <h4 id="historial-nombre" class="text-lg font-semibold text-white"></h4>
            <p id="historial-dni" class="text-sm text-gray-400"></p>
        </div>
        <div id="historial-content" class="space-y-4">
            <!-- Rellenado por JS -->
        </div>
      </div>
    </div>
  </div>
</body>
</html>
