<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Personal - Avanti</title>
  <link rel="icon" type="image/jpeg" href="/AVANTI%20LOGO%20(1).jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg-deep: #0F172A;
      --surface-slate: #1E293B;
      --border-subtle: #334155;
      --text-bright: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-green: #10B981;
    }

    body { background-color: var(--bg-deep); font-family: 'Inter', system-ui, sans-serif; color: var(--text-bright); overflow-x: hidden; }
    
    .neo-panel { background-color: var(--surface-slate); border: 1px solid var(--border-subtle); border-radius: 12px; }
    .neo-input { background-color: var(--bg-deep) !important; border: 1px solid var(--border-subtle) !important; color: var(--text-bright) !important; transition: border-color 0.2s ease; }
    .neo-input:focus { border-color: var(--accent-green) !important; outline: none; }

    /* CORE: TABULATOR Y SCROLL */
    .tabulator { border: none !important; background-color: transparent !important; font-size: 14px; height: auto !important; }
    .tabulator-tableholder { overflow-y: hidden !important; overflow-x: auto !important; height: auto !important; }
    
    .tabulator-header { background-color: var(--bg-deep) !important; color: var(--text-muted) !important; border-bottom: 1px solid var(--border-subtle) !important; }
    .tabulator-col { background-color: transparent !important; border-right: none !important; padding: 12px 6px !important; }
    .tabulator-col-title { font-weight: 600 !important; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
    
    .tabulator-row.tabulator-row-odd { background-color: var(--surface-slate) !important; border-bottom: 1px solid var(--border-subtle) !important; transition: background-color 0.2s ease; }
    .tabulator-row.tabulator-row-even { background-color: #141C2B !important; border-bottom: 1px solid var(--border-subtle) !important; transition: background-color 0.2s ease; }
    .tabulator-row:hover { background-color: #27364B !important; cursor: pointer; }
    .tabulator-cell { border-right: none !important; padding: 18px 12px !important; vertical-align: middle !important; color: var(--text-bright) !important;}
    
    /* 📱 VISTA MÓVIL PREMIUM */
    .tabulator-row .tabulator-responsive-collapse {
        background-color: var(--bg-deep) !important;
        padding: 16px !important;
        border-bottom: 2px solid var(--border-subtle) !important;
    }
    .tabulator-row .tabulator-responsive-collapse table { width: 100%; display: block; }
    .tabulator-row .tabulator-responsive-collapse table tbody { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .tabulator-row .tabulator-responsive-collapse table tr { 
        display: flex; flex-direction: column; 
        background: var(--surface-slate); padding: 12px 16px; 
        border-radius: 8px; border: 1px solid var(--border-subtle); 
    }
    .tabulator-row .tabulator-responsive-collapse table tr td { border: none !important; padding: 0 !important; display: block; text-align: left !important; }
    .tabulator-row .tabulator-responsive-collapse table tr td:first-of-type { 
        font-size: 10.5px !important; color: var(--text-muted) !important; 
        margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
        font-weight: 600; background: transparent !important; width: 100% !important; border: none !important;
    }
    .tabulator-row .tabulator-responsive-collapse table tr td:last-of-type { font-size: 14.5px !important; width: 100% !important; padding: 0 !important; }
    .tabulator-row .tabulator-responsive-collapse table tr td:last-of-type > div { justify-content: flex-start !important; text-align: left !important; }

    .tabulator-header input[type="text"], .tabulator-header input[type="search"] {
      background-color: var(--bg-deep) !important; border: 1px solid var(--border-subtle) !important; color: var(--text-bright) !important;
      border-radius: 6px; padding: 8px 12px !important; width: 100%; box-sizing: border-box; outline: none; transition: border 0.2s;
    }
    .tabulator-header input:focus { border-color: var(--accent-green) !important; }

    .tabulator-footer { background-color: var(--bg-deep) !important; border-top: 1px solid var(--border-subtle) !important; color: var(--text-muted) !important; padding: 12px !important;}
    .tabulator-footer .tabulator-page-size { background-color: var(--surface-slate); border: 1px solid var(--border-subtle); color: var(--text-bright); border-radius: 6px; padding: 4px 8px; outline: none; }
    .tabulator-footer .tabulator-page { background: transparent !important; border: 1px solid transparent !important; color: var(--text-muted) !important; border-radius: 6px; margin: 0 2px; transition: all 0.2s; }
    .tabulator-footer .tabulator-page:hover { background: var(--surface-slate) !important; color: var(--text-bright) !important; }
    .tabulator-footer .tabulator-page.active { background: var(--surface-slate) !important; color: var(--accent-green) !important; border: 1px solid var(--border-subtle) !important; font-weight: bold; }

    .action-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: #64748B; transition: all 0.2s ease; cursor: pointer; }
    .action-btn:hover { color: #F87171; background-color: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.2); }
    
    .btn-primary { background-color: var(--accent-green); color: #fff; border: 1px solid transparent; transition: background 0.2s; }
    .btn-primary:hover { background-color: #059669; }
    .btn-outline { background-color: var(--bg-deep); border: 1px solid var(--border-subtle); color: var(--text-bright); transition: border-color 0.2s; }
    .btn-outline:hover { border-color: var(--text-muted); }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-[1200px] mx-auto space-y-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-6 neo-panel">
      <div class="flex items-center gap-4">
        <div class="p-3 bg-[#0F172A] rounded-lg border border-[#334155]">
          <svg class="w-7 h-7 text-[#10B981]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-[#F8FAFC]">Directorio de Personal</h1>
          <p class="text-sm font-medium mt-0.5 text-[#94A3B8]">Gestión de empleados para asignación de equipos</p>
        </div>
      </div>
      <div class="mt-4 md:mt-0 flex w-full md:w-auto gap-3">
        <button onclick="location.href='dashboard.html'" class="flex-1 md:flex-none flex items-center justify-center gap-2 btn-outline font-medium py-2.5 px-5 rounded-lg text-sm transition">
          Dashboard
        </button>
        <button id="btn-add-empleado" onclick="document.getElementById('modal-empleado').classList.remove('hidden')" class="flex-1 md:flex-none flex items-center justify-center gap-2 btn-primary font-medium py-2.5 px-5 rounded-lg text-sm transition">
          + Añadir Empleado
        </button>
      </div>
    </div>

    <div class="neo-panel overflow-hidden p-0">
      <div id="empleados-grid" class="w-full"></div>
    </div>
  </div>

  <div id="modal-empleado" class="fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm z-[9999] hidden flex items-center justify-center p-4">
    <div class="neo-panel max-w-lg w-full overflow-hidden">
      <div class="px-6 py-5 flex justify-between items-center border-b border-[#334155] bg-[#0F172A]">
        <h3 class="font-bold text-lg text-[#F8FAFC]">Registrar Nuevo Empleado</h3>
        <button onclick="document.getElementById('modal-empleado').classList.add('hidden')" class="text-[#94A3B8] hover:text-[#10B981] transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <form id="form-empleado" class="p-6 space-y-5 bg-[#1E293B]">
        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold uppercase mb-1.5 text-[#94A3B8]">DNI *</label>
            <input type="text" id="emp-dni" required class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase mb-1.5 text-[#94A3B8]">Centro Costo</label>
            <input type="text" id="emp-cc" class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase mb-1.5 text-[#94A3B8]">Nombre Completo *</label>
          <input type="text" id="emp-nombre" required class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
        </div>
        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold uppercase mb-1.5 text-[#94A3B8]">Área / Departamento *</label>
            <input type="text" id="emp-area" required class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase mb-1.5 text-[#94A3B8]">Cargo / Puesto *</label>
            <input type="text" id="emp-cargo" required class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase mb-1.5 text-[#94A3B8]">Correo Corporativo</label>
          <input type="email" id="emp-correo" class="w-full px-4 py-2.5 rounded-lg text-sm neo-input">
        </div>
        <div class="pt-5 flex justify-end gap-3 border-t border-[#334155] mt-4">
          <button type="button" onclick="document.getElementById('modal-empleado').classList.add('hidden')" class="btn-outline px-5 py-2.5 rounded-lg font-medium text-sm">Cancelar</button>
          <button type="submit" id="btn-save-emp" class="btn-primary px-5 py-2.5 rounded-lg font-medium text-sm">Guardar Empleado</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let tablaEmpleados;
    const sessionData = JSON.parse(localStorage.getItem('session') || '{}');
    const isGuest = sessionData.role === 'viewer';

    if (isGuest) {
      document.getElementById('btn-add-empleado').style.display = 'none';
    }

    async function cargarEmpleados() {
      try {
        const res = await fetch('/api/empleados');
        const data = await res.json();
        
        if(tablaEmpleados) {
            tablaEmpleados.setData(data.data);
            return;
        }

        let cols = [
            { title: "DNI", field: "dni", minWidth: 120, hozAlign: "center", headerHozAlign: "center", headerFilter: "input", formatter: cell => `<div class="w-full flex items-center justify-center h-full text-[#94A3B8] font-mono text-xs">${cell.getValue()}</div>` },
            { title: "Empleado", field: "nombre_completo", minWidth: 260, hozAlign: "left", headerHozAlign: "left", headerFilter: "input", formatter: cell => {
                let name = cell.getValue();
                let email = cell.getRow().getData().correo_corp || "Sin correo corporativo";
                return `<div class="w-full flex flex-col justify-center h-full text-left"><div class="font-medium text-[#F8FAFC] tracking-wide whitespace-normal break-words leading-relaxed text-justify">${name}</div><div class="text-xs mt-1 text-[#94A3B8] font-light break-words">${email}</div></div>`;
              }
            },
            { title: "Área", field: "area", minWidth: 180, hozAlign: "left", headerHozAlign: "left", headerFilter: "input", formatter: cell => `<div class="w-full flex items-center h-full text-left text-[#E2E8F0] whitespace-normal break-words leading-relaxed text-justify">${cell.getValue()}</div>` },
            { title: "Cargo", field: "cargo", minWidth: 180, hozAlign: "left", headerHozAlign: "left", headerFilter: "input", formatter: cell => `<div class="w-full flex items-center h-full text-left text-[#CBD5E1] font-light whitespace-normal break-words leading-relaxed text-justify">${cell.getValue()}</div>` }
        ];

        if (!isGuest) {
            cols.push({ 
              title: "Acciones", minWidth: 100, hozAlign: "center", headerHozAlign: "center", headerSort: false,
              formatter: () => `<div class="w-full flex justify-center items-center h-full"><button class='action-btn btn-del' title='Eliminar Empleado'><svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button></div>`,
              cellClick: async function(e, cell) {
                if(e.target.closest('.btn-del')) {
                  if(confirm("¿Estás seguro de eliminar este empleado del directorio?\n\nSi el empleado tiene equipos asignados, estos quedarán 'sin asignar' en el inventario.")) {
                    const id = cell.getRow().getData().id_empleado;
                    try {
                        const response = await fetch('/api/empleados', { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id_empleado: id}) });
                        const data = await response.json();
                        if (response.ok && data.success) cell.getRow().delete();
                        else alert("❌ Error al eliminar: " + (data.error || 'Problema desconocido.'));
                    } catch(err) { alert("❌ Error de red."); }
                  }
                }
              }
            });
        }

        tablaEmpleados = new Tabulator("#empleados-grid", {
          data: data.data,
          layout: "fitColumns",
          responsiveLayout: "collapse",
          pagination: "local",
          paginationSize: 50, /* 50 Registros por defecto */
          columnDefaults: { vertAlign: "middle" }, /* Encuadre vertical global */
          columns: cols
        });
      } catch (err) { console.error("Error cargando empleados:", err); }
    }

    cargarEmpleados();

    document.getElementById('form-empleado').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isGuest) return alert('Modo solo lectura.');

      const btn = document.getElementById('btn-save-emp');
      btn.innerText = "Guardando...";
      
      const payload = {
        dni: document.getElementById('emp-dni').value,
        nombre_completo: document.getElementById('emp-nombre').value.toUpperCase(),
        area: document.getElementById('emp-area').value.toUpperCase(),
        cargo: document.getElementById('emp-cargo').value.toUpperCase(),
        correo_corp: document.getElementById('emp-correo').value.toLowerCase(),
        centro_costo: document.getElementById('emp-cc').value.toUpperCase()
      };

      try {
        const res = await fetch('/api/empleados', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (res.ok) { document.getElementById('modal-empleado').classList.add('hidden'); document.getElementById('form-empleado').reset(); cargarEmpleados(); } 
        else alert("Error al guardar.");
      } catch (err) { alert("Error de conexión."); }
      finally { btn.innerText = "Guardar Empleado"; }
    });
  </script>
</body>
</html>
